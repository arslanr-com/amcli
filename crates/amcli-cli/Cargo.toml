[package]
name = "amcli-cli"
description = "A CLI over ArchiMate models"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "amcli"
path = "src/main.rs"

[dependencies]
amcli-model.workspace = true
amcli-graph.workspace = true
amcli-validate.workspace = true
amcli-view.workspace = true
amcli-render.workspace = true
amcli-xml.workspace = true
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
# Only for parsing batch input. Output shapes are fixed and written by hand;
# hand-rolling a parser for arbitrary caller JSON would be a liability.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
